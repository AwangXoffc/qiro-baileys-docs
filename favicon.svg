<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Qiro Baileys emblem</title>
  <desc id="desc">An angular crowned mask emblem in teal and emerald, representing Qiro Baileys.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7affd3"/>
      <stop offset=".42" stop-color="#17d6ad"/>
      <stop offset="1" stop-color="#087d91"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#102c36"/>
      <stop offset="1" stop-color="#050b15"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8fff4"/>
      <stop offset="1" stop-color="#36e9c0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
